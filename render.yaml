# Render Blueprint for the Nova Labs API.
#
# Deploy with:  render blueprint launch
#
# Secrets are declared with `sync: false`, which means Render prompts for them
# (or you set them in the dashboard) instead of them living in this file. The
# only generated value is SECRET_KEY — Render creates a strong one, so the
# token-signing key never exists in the repo or on anyone's laptop.

services:
  - type: web
    name: novalabs-api
    runtime: python
    plan: free
    rootDir: backend
    region: singapore # closest to the Indian learner base
    buildCommand: pip install -r requirements.txt
    # --no-proxy-headers is deliberate. uvicorn's ProxyHeadersMiddleware rewrites
    # request.client from the LEFT-most X-Forwarded-For entry, which the client
    # controls, letting anyone bypass every rate limit. The app resolves the
    # caller's IP itself in core/ratelimit.py using the right-most entry, gated
    # behind TRUST_PROXY_HEADERS below.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.13"

      # Turns on the production config guard in core/config.py.
      - key: DEBUG
        value: "false"

      # Render terminates TLS at its edge and appends the real client IP as the
      # right-most X-Forwarded-For entry. Without this every request would look
      # like it came from Render's proxy and share one rate-limit bucket.
      - key: TRUST_PROXY_HEADERS
        value: "true"

      - key: SECRET_KEY
        generateValue: true

      # Password-reset and verification links are built from this, and it is
      # also the sole CORS origin. Must be the real frontend URL.
      - key: FRONTEND_URL
        sync: false

      # The frontend proxies the API under /api, so the refresh cookie must be
      # scoped to the path the browser actually requests. Left at the default
      # "/auth" it is stored but never sent, and every session dies at the
      # first token refresh.
      - key: REFRESH_COOKIE_PATH
        value: "/api/auth"

      # Postgres connection string. Must use the asyncpg driver, e.g.
      #   postgresql+asyncpg://user:pass@host/db
      - key: DATABASE_URL
        sync: false

      # Payments. RAZORPAY_WEBHOOK_SECRET is required for boot: without it,
      # payment confirmations could be forged.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Transactional email. Unset is survivable — send_email logs instead of
      # sending — but verification codes and password resets will not arrive.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Media storage. Without it uploads land on the container's local disk,
      # which Render wipes on every deploy.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      # Web push.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
